[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/subh05sus/shotmaxxing"
authors = ["Shotmaxxing contributors"]

[workspace.dependencies]
shotmaxxing-core = { path = "crates/core" }
shotmaxxing-capture = { path = "crates/capture" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# Dependencies stay optimised in debug builds so video and GPU work is usable while developing.
[profile.dev.package."*"]
opt-level = 2
