[package]
name = "shotmaxxing-control"
description = "The control API between the shotmaxxing command and the running Shotmaxxing app: JSON lines over a private local socket, or a named pipe on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
shotmaxxing-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# Naming the process on the other end of the socket, and checking who signed its app.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
