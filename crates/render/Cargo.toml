[package]
name = "shotmaxxing-render"
description = "Draws Shotmaxxing projects into finished videos: the editor's canvas, camera, cursor and overlays, with Core Image on macOS and a portable compositor elsewhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
shotmaxxing-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
realfft = "3"
tracing.workspace = true
tiny-skia = "0.11"
gif = "0.13"
color_quant = "1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-image = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-text = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-image-io = "0.3"
objc2-avf-audio = "0.3"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
