<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9fb5a"/>
      <stop offset="1" stop-color="#9fe024"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Artwork sits on the 824 px grid inside the 1024 px canvas, like the platform templates. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fill)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <g transform="translate(512 512) scale(22)" fill="none" stroke="#18210c" stroke-width="1.75" stroke-linecap="round">
    <circle r="10"/>
    <path d="M0 -3.6 L9.79 2.05"/>
    <path d="M0 -3.6 L9.79 2.05" transform="rotate(60)"/>
    <path d="M0 -3.6 L9.79 2.05" transform="rotate(120)"/>
    <path d="M0 -3.6 L9.79 2.05" transform="rotate(180)"/>
    <path d="M0 -3.6 L9.79 2.05" transform="rotate(240)"/>
    <path d="M0 -3.6 L9.79 2.05" transform="rotate(300)"/>
  </g>
</svg>
