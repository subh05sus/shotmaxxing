<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Installer art</title>
    <!--
      The pictures in the installers, drawn here and rendered by scripts/installer-art.py into
      apps/desktop/src-tauri/installer/. Open this file with a hash to see one: #dmg, #nsis-sidebar, #nsis-header,
      #wix-banner, #wix-dialog, or #dmg-preview (the disk image window as Finder shows it, to check the layout).

      Colours copy the app's tokens (packages/ui/src/styles/tokens.css, dark theme) so the installers match the app.
    -->
    <style>
      :root {
        --stage: oklch(0.155 0.004 264); /* --stage, dark */
        --stage-low: oklch(0.13 0.004 264);
        --lime: oklch(0.87 0.21 128); /* --lime */
        --lime-ink: oklch(0.22 0.05 130); /* --lime-ink */
        --record: oklch(0.67 0.22 25); /* --record, dark */
        --on-stage: oklch(0.97 0 0 / 0.86); /* --fg-on-stage */
        --tile-top: oklch(0.969 0.084 117); /* --icon-tile-top */
        --tile-bottom: oklch(0.835 0.209 128); /* --icon-tile-bottom */
        --ink: oklch(0.22 0.01 264);
        --paper: oklch(1 0 0);
        /*
          Finder writes the names under the icons in white in Dark Mode and black in Light Mode. These plates are the
          one mid tone where both pass: relative luminance 0.179, which gives white and black text 4.58 to 1 each.
        */
        --plate: oklch(0.561 0.03 128);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--stage);
        overflow: hidden;
      }
      body {
        font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      section {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        overflow: hidden;
      }
      section:target {
        display: block;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .night {
        background: linear-gradient(180deg, var(--stage), var(--stage-low));
      }
      /* The aurora: a few soft, tilted curtains of lime, uneven on purpose. */
      .curtain {
        position: absolute;
        border-radius: 50%;
        background: var(--lime);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        mix-blend-mode: overlay;
      }
      .mono {
        font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .rec {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--on-stage);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .rec i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--record);
        box-shadow: 0 0 8px oklch(0.67 0.22 25 / 0.6);
      }
      .rec .mono {
        font-weight: 500;
        opacity: 0.78;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.9"
            numOctaves="2"
            seed="7"
            stitchTiles="stitch"
          />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--tile-top)" />
          <stop offset="1" stop-color="var(--tile-bottom)" />
        </linearGradient>
        <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="var(--lime)" stop-opacity="0" />
          <stop offset="0.35" stop-color="var(--lime)" stop-opacity="0.75" />
          <stop offset="1" stop-color="var(--lime)" stop-opacity="0.95" />
        </linearGradient>
        <!-- The mark: a ring around six blade edges (packages/ui/src/components/Logo.svelte). -->
        <g id="mark" fill="none" stroke-width="1.9" stroke-linecap="round">
          <circle r="10" />
          <path d="M0 -3.6 L9.79 2.05" />
          <path d="M0 -3.6 L9.79 2.05" transform="rotate(60)" />
          <path d="M0 -3.6 L9.79 2.05" transform="rotate(120)" />
          <path d="M0 -3.6 L9.79 2.05" transform="rotate(180)" />
          <path d="M0 -3.6 L9.79 2.05" transform="rotate(240)" />
          <path d="M0 -3.6 L9.79 2.05" transform="rotate(300)" />
        </g>
        <!-- The app icon: the mark in ink on the lime tile, 36.4 units across like the real one. -->
        <g id="icon">
          <rect x="-18.2" y="-18.2" width="36.4" height="36.4" rx="10.2" fill="url(#tile)" />
          <use href="#mark" stroke="var(--lime-ink)" />
        </g>
        <!-- A viewfinder corner, its point at 0,0, arms along +x and +y. -->
        <path id="corner" d="M0 26V7Q0 0 7 0H26" fill="none" stroke-width="2.5" stroke-linecap="round" />
        <path id="corner-sm" d="M0 17V5Q0 0 5 0H17" fill="none" stroke-width="2" stroke-linecap="round" />
      </defs>
    </svg>

    <!-- ============================================================ Disk image: 660 × 440, the window shows 660 × 400 -->
    <section id="dmg" style="width: 660px; height: 440px">
      <div class="layer night"></div>
      <div
        class="curtain"
        style="
          left: -60px;
          top: 8px;
          width: 460px;
          height: 130px;
          opacity: 0.13;
          transform: rotate(-14deg);
          filter: blur(34px);
        "
      ></div>
      <div
        class="curtain"
        style="
          left: 360px;
          top: -30px;
          width: 300px;
          height: 80px;
          opacity: 0.06;
          transform: rotate(11deg);
          filter: blur(30px);
          background: oklch(0.85 0.15 165);
        "
      ></div>
      <div
        class="curtain"
        style="
          left: 380px;
          top: 300px;
          width: 330px;
          height: 96px;
          opacity: 0.08;
          transform: rotate(-9deg);
          filter: blur(32px);
        "
      ></div>
      <div
        class="curtain"
        style="
          left: 40px;
          top: 320px;
          width: 180px;
          height: 60px;
          opacity: 0.045;
          transform: rotate(6deg);
          filter: blur(26px);
        "
      ></div>
      <svg class="grain" width="660" height="440"><rect width="660" height="440" filter="url(#grain)" /></svg>

      <svg class="layer" width="660" height="440" viewBox="0 0 660 440">
        <!-- Viewfinder corners, inset from the 660 × 400 the window shows. -->
        <g stroke="var(--lime)" opacity="0.9">
          <use href="#corner" transform="translate(20 20)" />
          <use href="#corner" transform="translate(640 20) scale(-1 1)" />
          <use href="#corner" transform="translate(20 380) scale(1 -1)" />
          <use href="#corner" transform="translate(640 380) scale(-1 -1)" />
        </g>
        <!-- The drag: a smooth cursor path from the app over to Applications, ending in a click. -->
        <path
          d="M236 112C296 44 404 38 461 95"
          fill="none"
          stroke="url(#trail)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-dasharray="0.1 7"
        />
        <circle cx="466" cy="100" r="17" fill="none" stroke="var(--lime)" stroke-width="1.5" opacity="0.32" />
        <circle cx="466" cy="100" r="9.5" fill="none" stroke="var(--lime)" stroke-width="2" opacity="0.75" />
        <path
          d="M466 100v17.5l4.4-4.1 3.2 6.9 2.9-1.3-3.1-6.8h6.1z"
          fill="oklch(0.16 0 0)"
          stroke="oklch(1 0 0)"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>

      <div class="rec" style="left: 46px; top: 38px"><i></i>REC <span class="mono">00:00:07</span></div>
      <p
        style="
          position: absolute;
          right: 46px;
          top: 38px;
          color: var(--on-stage);
          opacity: 0.42;
          font-size: 10px;
          font-weight: 650;
          letter-spacing: 0.2em;
          line-height: 13px;
        "
      >
        SHOTMAXXING
      </p>

      <!-- Plates under the names Finder writes below each icon. -->
      <div
        style="
          position: absolute;
          left: 110px;
          top: 236px;
          width: 140px;
          height: 34px;
          border-radius: 17px;
          background: var(--plate);
          box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.07);
        "
      ></div>
      <div
        style="
          position: absolute;
          left: 410px;
          top: 236px;
          width: 140px;
          height: 34px;
          border-radius: 17px;
          background: var(--plate);
          box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.07);
        "
      ></div>

      <p
        style="
          position: absolute;
          left: 0;
          right: 0;
          top: 292px;
          text-align: center;
          color: var(--on-stage);
          font-size: 14px;
          font-weight: 600;
          letter-spacing: -0.01em;
        "
      >
        Drag Shotmaxxing into Applications
      </p>
      <p
        style="
          position: absolute;
          left: 120px;
          right: 120px;
          top: 316px;
          text-align: center;
          color: var(--on-stage);
          opacity: 0.66;
          font-size: 11.5px;
          line-height: 16px;
          text-wrap: balance;
        "
      >
        The first time it opens, macOS stops it once. Choose Open Anyway in System Settings › Privacy &amp;
        Security.
      </p>
    </section>

    <!-- ============================================================ Setup (.exe) sidebar: 164 × 314 -->
    <section id="nsis-sidebar" style="width: 164px; height: 314px">
      <div class="layer night"></div>
      <div
        class="curtain"
        style="
          left: -70px;
          top: 20px;
          width: 260px;
          height: 110px;
          opacity: 0.16;
          transform: rotate(-16deg);
          filter: blur(28px);
        "
      ></div>
      <div
        class="curtain"
        style="
          left: 40px;
          top: 230px;
          width: 190px;
          height: 70px;
          opacity: 0.08;
          transform: rotate(-8deg);
          filter: blur(24px);
        "
      ></div>
      <svg class="grain" width="164" height="314"><rect width="164" height="314" filter="url(#grain)" /></svg>
      <svg class="layer" width="164" height="314" viewBox="0 0 164 314">
        <g stroke="var(--lime)" opacity="0.9">
          <use href="#corner-sm" transform="translate(12 12)" />
          <use href="#corner-sm" transform="translate(152 12) scale(-1 1)" />
          <use href="#corner-sm" transform="translate(12 302) scale(1 -1)" />
          <use href="#corner-sm" transform="translate(152 302) scale(-1 -1)" />
        </g>
        <use href="#icon" transform="translate(82 96) scale(1.8)" />
      </svg>
      <p
        style="
          position: absolute;
          left: 0;
          right: 0;
          top: 140px;
          text-align: center;
          color: var(--on-stage);
          font-size: 17px;
          font-weight: 650;
          letter-spacing: -0.02em;
        "
      >
        Shotmaxxing
      </p>
      <p
        style="
          position: absolute;
          left: 22px;
          right: 22px;
          top: 164px;
          text-align: center;
          color: var(--on-stage);
          opacity: 0.62;
          font-size: 11px;
          line-height: 15px;
        "
      >
        Demos that edit themselves
      </p>
      <div class="rec" style="left: 26px; top: 276px; font-size: 10px">
        <i style="width: 7px; height: 7px"></i>REC <span class="mono">00:00:07</span>
      </div>
    </section>

    <!-- ============================================================ Setup (.exe) header: 150 × 57, on the left of a white header -->
    <section id="nsis-header" style="width: 150px; height: 57px; background: var(--paper)">
      <div
        class="curtain"
        style="left: -24px; top: 6px; width: 90px; height: 46px; opacity: 0.22; filter: blur(16px)"
      ></div>
      <svg class="layer" width="150" height="57" viewBox="0 0 150 57">
        <use href="#icon" transform="translate(30 28.5) scale(1.04)" />
      </svg>
      <p
        style="
          position: absolute;
          left: 56px;
          top: 19px;
          color: var(--ink);
          font-size: 14px;
          font-weight: 650;
          letter-spacing: -0.015em;
          line-height: 18px;
        "
      >
        Shotmaxxing
      </p>
    </section>

    <!-- ============================================================ .msi banner: 493 × 58; the installer writes its title on the left -->
    <section id="wix-banner" style="width: 493px; height: 58px; background: var(--paper)">
      <div
        class="curtain"
        style="left: 380px; top: -4px; width: 150px; height: 66px; opacity: 0.2; filter: blur(18px)"
      ></div>
      <svg class="layer" width="493" height="58" viewBox="0 0 493 58">
        <use href="#icon" transform="translate(455 29) scale(1.1)" />
      </svg>
    </section>

    <!-- ============================================================ .msi welcome and finish: 493 × 312; text goes on the white right -->
    <section id="wix-dialog" style="width: 493px; height: 312px; background: var(--paper)">
      <div style="position: absolute; left: 0; top: 0; width: 164px; height: 312px; overflow: hidden">
        <div class="layer night"></div>
        <div
          class="curtain"
          style="
            left: -70px;
            top: 18px;
            width: 260px;
            height: 110px;
            opacity: 0.16;
            transform: rotate(-16deg);
            filter: blur(28px);
          "
        ></div>
        <div
          class="curtain"
          style="
            left: 40px;
            top: 228px;
            width: 190px;
            height: 70px;
            opacity: 0.08;
            transform: rotate(-8deg);
            filter: blur(24px);
          "
        ></div>
        <svg class="grain" width="164" height="312">
          <rect width="164" height="312" filter="url(#grain)" />
        </svg>
        <svg class="layer" width="164" height="312" viewBox="0 0 164 312">
          <g stroke="var(--lime)" opacity="0.9">
            <use href="#corner-sm" transform="translate(12 12)" />
            <use href="#corner-sm" transform="translate(152 12) scale(-1 1)" />
            <use href="#corner-sm" transform="translate(12 300) scale(1 -1)" />
            <use href="#corner-sm" transform="translate(152 300) scale(-1 -1)" />
          </g>
          <use href="#icon" transform="translate(82 95) scale(1.8)" />
        </svg>
        <p
          style="
            position: absolute;
            left: 0;
            right: 0;
            top: 139px;
            text-align: center;
            color: var(--on-stage);
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -0.02em;
          "
        >
          Shotmaxxing
        </p>
        <p
          style="
            position: absolute;
            left: 22px;
            right: 22px;
            top: 163px;
            text-align: center;
            color: var(--on-stage);
            opacity: 0.62;
            font-size: 11px;
            line-height: 15px;
          "
        >
          Demos that edit themselves
        </p>
        <div class="rec" style="left: 26px; top: 274px; font-size: 10px">
          <i style="width: 7px; height: 7px"></i>REC <span class="mono">00:00:07</span>
        </div>
      </div>
    </section>

    <!-- ============================================================ Preview: the disk image window as Finder draws it -->
    <section id="dmg-preview" style="width: 1340px; height: 460px; background: oklch(0.3 0 0)">
      <script>
        // Two windows side by side: Dark Mode names in white, Light Mode names in black, over the app's icon and, when
        // ?folder= gives one (a PNG of the system's Applications folder, which isn't kept here), the folder.
        const folder = new URLSearchParams(location.search).get('folder') ?? '';
        for (const [x, ink] of [
          [10, 'white'],
          [680, 'black'],
        ]) {
          document.write(`
            <div style="position:absolute;left:${x}px;top:30px;width:660px;height:400px;overflow:hidden;border-radius:10px">
              <iframe src="installer-art.html#dmg" style="border:0;width:660px;height:440px"></iframe>
              <img src="../../apps/desktop/src-tauri/icons/128x128@2x.png" style="position:absolute;left:116px;top:106px;width:128px;height:128px">
              <img src="${folder}" onerror="this.remove()" style="position:absolute;left:416px;top:106px;width:128px;height:128px">
              ${['Shotmaxxing', 'Applications'].map((name, i) => `<p style="position:absolute;left:${i ? 400 : 100}px;width:160px;top:242px;text-align:center;font:16px system-ui;color:${ink}">${name}</p>`).join('')}
            </div>`);
        }
      </script>
    </section>
  </body>
</html>
