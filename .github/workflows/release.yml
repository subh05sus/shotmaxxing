name: Release

# Pushing a tag such as v0.1.0 builds the app for macOS (Apple silicon and Intel) and Windows, and drafts one GitHub
# release with all three. Starting the workflow by hand (Actions → Release → Run workflow) builds the same without a
# release, to check the release builds before tagging: the installers are kept on that run's page.
#
# Tag the tip of main, and leave the workflows alone until the release is drafted: GitHub won't let the Actions token
# create a release for a commit whose files under .github/workflows differ from main's.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Only a tag makes a release.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # What macOS ties Screen Recording and Accessibility to. Every release signed with the fixed identity carries the same
  # requirement, so permissions carry over between updates. A new identity would reset everyone's permissions.
  SIGNING_REQUIREMENT: identifier "dev.shotmaxxing.desktop" and certificate leaf = H"176751cd515f9ced4a53a3734aeaebd6645581a2"
  RELEASE_BODY: |
    A preview build. Install or update it with one line, which opens the app without a security warning:

    - **macOS 14 or later**, in Terminal: `curl -fsSL https://shotmaxxing.app/install | bash`
    - **Windows 10 (version 2004) or later, 64-bit**, in PowerShell: `irm https://shotmaxxing.app/install.ps1 | iex`

    The files below, downloaded in a browser, aren't notarized by Apple or signed for Windows yet: macOS stops the app
    the first time (choose Done, then Open Anyway in System Settings → Privacy & Security), and SmartScreen asks for
    More info → Run anyway.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS on Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built on Apple silicon; .cargo/config.toml keeps the Intel instruction sets on.
          - name: macOS on Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Secrets can't be read in an if, so this says whether the signing identity is there.
      HAS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      # An ad-hoc build's requirement is its own hash, so after every update the switches in System Settings stay on
      # but no longer match. The fixed self-signed identity (free, no Apple account) keeps one requirement for every
      # release. Without the secret the build is ad-hoc, as before.
      - name: Signing identity
        if: runner.os == 'macOS' && env.HAS_SIGNING_IDENTITY == 'true'
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Tauri signs with the identity named here instead of the release config's ad-hoc "-".
          echo "APPLE_SIGNING_IDENTITY=Shotmaxxing" >> "$GITHUB_ENV"
          # Tauri would sign the disk image with it too, and macOS 15 stops a downloaded disk image signed by an
          # identity Apple doesn't vouch for before anyone reaches the app inside (tauri-apps/tauri#12288). Unsigned,
          # as before, it opens, and only the app asks for Open Anyway. So during the build, codesign leaves .dmg
          # files alone; everything else, and every check, goes to the real one.
          shim="$RUNNER_TEMP/codesign-shim"
          mkdir -p "$shim"
          cat > "$shim/codesign" <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            if [ "$arg" = -s ] || [ "$arg" = --sign ]; then
              case "${!#}" in *.dmg) echo "Leaving ${!#} unsigned"; exit 0 ;; esac
            fi
          done
          exec /usr/bin/codesign "$@"
          EOF
          chmod +x "$shim/codesign"
          echo "$shim" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Agents start the shotmaxxing command, which ships inside the app next to the app's own binary.
      - run: node scripts/build-cli-sidecar.mjs --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG && format('Shotmaxxing {0}', env.TAG) || '' }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - name: The app carries the fixed signing identity, and the disk image isn't signed
        if: runner.os == 'macOS' && env.HAS_SIGNING_IDENTITY == 'true'
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Shotmaxxing.app"
          if [ ! -d "$app" ]; then
            echo "::error::no app at $app; these were built:"
            find . -type d -name Shotmaxxing.app -not -path '*/node_modules/*'
            exit 1
          fi
          requirement() { codesign -d -r- "$1" 2>&1 | sed -nE 's/^(# )?designated => //p'; }
          codesign --verify --deep --strict --verbose=2 "$app"
          got="$(requirement "$app")"
          echo "Designated requirement: $got"
          if [ "$got" != "$SIGNING_REQUIREMENT" ]; then
            echo "::error::the app's designated requirement isn't the fixed identity's, so permissions wouldn't carry over"
            exit 1
          fi
          dmg="$(find "$bundle/dmg" -name '*.dmg' | head -1)"
          if [ -z "$dmg" ]; then
            echo "::error::no disk image in $bundle/dmg"
            exit 1
          fi
          signature="$(/usr/bin/codesign -dv "$dmg" 2>&1 || true)"
          case "$signature" in
            *"not signed at all"*) echo "$(basename "$dmg") isn't signed, so a copy downloaded in a browser opens" ;;
            *)
              echo "::error::$(basename "$dmg") is signed, so macOS would stop a downloaded copy: $signature"
              exit 1
              ;;
          esac
          # The app inside it is the signed one. The disk image asks to agree to the license first.
          mount="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount"
          printf 'qy\n' | hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg" >/dev/null
          inside="$(requirement "$mount/Shotmaxxing.app")"
          hdiutil detach "$mount" -force >/dev/null
          if [ "$inside" != "$SIGNING_REQUIREMENT" ]; then
            echo "::error::the app in $(basename "$dmg") has the designated requirement \"$inside\""
            exit 1
          fi
          echo "The app in $(basename "$dmg") carries it too."
