name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: UI (design guard, format, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build

  # The install workflow installs from these for real; this is the quick check on every push.
  installers:
    name: Install lines (shellcheck, one release everywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
      - name: install.sh, install.ps1, the cask, winget and the README name the same release
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' install.sh)"
          test -n "$v"
          fail() { echo "::error::$1 doesn't name release $v, as install.sh does"; exit 1; }
          # install.ps1 is checked out with Windows line endings.
          tr -d '\r' < install.ps1 | grep -qx "  \$Version = '$v'" || fail install.ps1
          grep -qx "  version \"$v\"" Casks/shotmaxxing.rb || fail "The cask"
          test -d "packaging/winget/manifests/s/subh05sus/Shotmaxxing/$v" || fail "packaging/winget"
          if grep -o 'releases/download/v[^/]*' README.md | grep -vx "releases/download/v$v"; then fail README.md; fi

  rust:
    name: Rust on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built UI, so it has to exist before Rust compiles.
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # Recording needs a desktop that can be captured and Media Foundation's encoder, which hosted runners may
      # lack: this reports how it went without failing the build.
      # These run even when a test above failed, so every run says how recording and UI Automation fare.
      - if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        run: cargo test -p shotmaxxing-capture -- --ignored --nocapture
      # Reads Notepad's controls through UI Automation, also without failing the build.
      - if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        run: cargo test -p shotmaxxing-agent -- --ignored --nocapture
      # Says which of Windows's own packaged apps the package check read, and what their packages said. The test
      # itself runs above; this only shows its findings.
      - if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: true
        run: cargo test -p shotmaxxing-control --lib packaged_apps_are_told_by_their_package -- --nocapture
