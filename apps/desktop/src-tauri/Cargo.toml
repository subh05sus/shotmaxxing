[package]
name = "shotmaxxing-desktop"
description = "The Shotmaxxing desktop app: windows, tray, permissions and the bridge to the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "shotmaxxing-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shotmaxxing-core.workspace = true
shotmaxxing-capture.workspace = true
shotmaxxing-render.workspace = true
shotmaxxing-captions.workspace = true
shotmaxxing-control.workspace = true
shotmaxxing-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
# Settings files keep their order when an agent is connected.
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
trash = "5"
base64 = "0.22"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSProcessInfo", "NSDictionary", "NSString", "NSValue"] }
# The red edge round the screen during an agent's take, and the red dot on the menu-bar icon.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
