[package]
name = "shotmaxxing-desktop"
description = "The Shotmaxxing desktop app: windows, tray, permissions and the bridge to the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "shotmaxxing-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shotmaxxing-core.workspace = true
shotmaxxing-capture.workspace = true
shotmaxxing-render.workspace = true
shotmaxxing-captions.workspace = true
shotmaxxing-control.workspace = true
shotmaxxing-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
# Settings files keep their order when an agent is connected.
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
trash = "5"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSDictionary", "NSString", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Power", "Win32_System_Registry"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
